<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisielec</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--bg2:#0d0d1a;--surface:#111122;--surface2:#161628;
  --border:#1e1e36;--border2:#2a2a48;
  --gold:#c9a84c;--gold2:#e8c96a;--gold-dim:#7a6128;
  --red:#c94040;--red2:#e85555;--green:#3daa6e;--green2:#55cc88;
  --text:#eeeaf0;--text2:#9990b8;--text3:#5a5475;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Crimson Pro',Georgia,serif;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;overflow-x:hidden;position:relative;
}

/* Background atmosphere */
.bg-stars{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 15% 20%,rgba(255,255,255,.55) 0%,transparent 100%),
    radial-gradient(1px 1px at 72% 8%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 88% 35%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 33% 60%,rgba(255,255,255,.35) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 80%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 4% 72%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 95% 65%,rgba(255,255,255,.45) 0%,transparent 100%),
    radial-gradient(1px 1px at 45% 12%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 78% 52%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 62% 28%,rgba(201,168,76,.7) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 22% 42%,rgba(201,168,76,.5) 0%,transparent 100%);
}
.bg-vignette{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 80% at 50% 40%,transparent 20%,rgba(5,5,12,.88) 100%);
}
.bg-fog{
  position:fixed;bottom:0;left:0;right:0;height:30%;pointer-events:none;z-index:0;
  background:linear-gradient(to top,rgba(8,8,16,.8) 0%,transparent 100%);
}

/* Layout */
.page{
  position:relative;z-index:1;width:100%;max-width:880px;
  padding:2.5rem 1.5rem 5rem;
  display:flex;flex-direction:column;align-items:center;gap:1.8rem;
}

/* Header */
.header{text-align:center}
.title{
  font-family:'Cinzel',serif;font-size:clamp(2.2rem,6vw,4rem);font-weight:900;
  letter-spacing:.25em;
  background:linear-gradient(135deg,#5c4010 0%,#c9a84c 30%,#f0d980 52%,#c9a84c 72%,#5c4010 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:title-pulse 5s ease-in-out infinite alternate;
  margin-bottom:.4rem;
}
@keyframes title-pulse{
  0%{filter:drop-shadow(0 0 10px rgba(201,168,76,.1))}
  100%{filter:drop-shadow(0 0 40px rgba(201,168,76,.3))}
}
.tagline{font-style:italic;font-size:.82rem;color:var(--text3);letter-spacing:.2em;text-transform:uppercase}

/* Score */
.score-strip{display:flex;gap:2.5rem}
.score-item{text-align:center}
.score-label{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.22em;color:var(--text3);text-transform:uppercase;display:block}
.score-val{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:600;color:var(--gold);display:block;margin-top:.1rem}

/* Arena */
.arena{
  width:100%;display:grid;grid-template-columns:220px 1fr;gap:1.5rem;align-items:start;
}
@media(max-width:580px){.arena{grid-template-columns:1fr}}

/* Gallows card */
.gallows-card{
  background:var(--surface);border:1px solid var(--border2);border-radius:16px;
  padding:1.25rem 1rem;display:flex;flex-direction:column;align-items:center;gap:1rem;
  position:relative;overflow:hidden;
}
.gallows-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 110%,rgba(201,168,76,.05) 0%,transparent 65%);
  pointer-events:none;
}
#gsvg{width:190px;height:215px;overflow:visible}

/* Rope + body gentle idle sway */
.sway-group{transform-origin:130px 38px;animation:sway-idle 4s ease-in-out infinite}
@keyframes sway-idle{
  0%,100%{transform:rotate(0deg)}
  25%{transform:rotate(.7deg)}
  75%{transform:rotate(-.5deg)}
}

/* Draw-on for each body part */
.gpart{opacity:0;stroke-dasharray:300;stroke-dashoffset:300;transition:opacity .05s}
.gpart.show{opacity:1;animation:draw-part .55s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw-part{to{stroke-dashoffset:0}}
#ph{stroke-dasharray:110;stroke-dashoffset:110}
.face-el{opacity:0;transition:opacity .35s .55s}
.face-el.show{opacity:1}

/* Lives pips */
.lives-row{display:flex;gap:5px}
.pip{
  width:9px;height:26px;border-radius:3px;
  background:var(--gold);box-shadow:0 0 7px rgba(201,168,76,.35);
  transition:background .45s,height .45s,transform .3s,box-shadow .4s;
}
.pip.lost{background:var(--red);height:13px;transform:scaleX(.65);box-shadow:0 0 7px rgba(201,80,80,.3)}

/* Info panel */
.info-panel{display:flex;flex-direction:column;gap:1rem}
.cat-row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.cat-badge{
  font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.25rem .9rem;border:1px solid var(--gold-dim);border-radius:999px;
  color:var(--gold);background:rgba(201,168,76,.06);
}
.proverb-flag{font-size:.7rem;font-style:italic;color:var(--text3)}
.info-box{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:.9rem 1.15rem}
.box-lbl{font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:.4rem}
.hint-text{font-size:1rem;font-style:italic;color:var(--text2);line-height:1.6}
.wrong-area{display:flex;flex-wrap:wrap;gap:5px;min-height:26px}
.wchip{
  font-family:'Cinzel',serif;font-size:.8rem;color:var(--red2);
  padding:.12rem .48rem;border:1px solid rgba(200,80,80,.25);border-radius:5px;
  background:rgba(200,80,80,.06);
  animation:chip-pop .28s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes chip-pop{
  0%{transform:scale(0) rotate(-15deg);opacity:0}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}

/* Progress bar */
.prog-track{height:3px;border-radius:2px;background:var(--border2);overflow:hidden;margin-top:.3rem}
.prog-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dim),var(--gold2));transition:width .5s ease}
.prog-text{font-size:.78rem;font-style:italic;color:var(--text3);margin-top:.4rem}

/* Word display */
.word-wrap{
  width:100%;background:var(--surface);border:1px solid var(--border2);
  border-radius:14px;padding:1.75rem 1.25rem;position:relative;overflow:hidden;
}
.word-wrap::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 80% at 50% 100%,rgba(201,168,76,.04) 0%,transparent 70%);
}
.word-inner{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;align-items:flex-end}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot-ch{
  font-family:'Cinzel',serif;font-size:clamp(1.5rem,3.5vw,2.1rem);font-weight:600;
  color:var(--gold);min-width:1.1ch;text-align:center;
  min-height:2.2rem;display:flex;align-items:flex-end;justify-content:center;
}
.slot-ch.reveal{animation:letter-drop .4s cubic-bezier(.34,1.56,.64,1) both}
.slot-ch.reveal-wrong{color:var(--red2);animation:letter-drop .4s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letter-drop{
  0%{transform:translateY(-20px) scale(.4);opacity:0}
  65%{transform:translateY(5px) scale(1.15)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
.slot-line{width:100%;height:1.5px;background:var(--border2);border-radius:1px;transition:background .4s,box-shadow .4s}
.slot.lit .slot-line{background:var(--gold);box-shadow:0 0 9px rgba(201,168,76,.45)}
.slot.sp .slot-line{background:transparent!important;box-shadow:none!important}

/* Status banner */
.banner{width:100%;border-radius:14px;padding:1.5rem 2rem;text-align:center;display:none}
.banner.win{
  display:block;
  background:radial-gradient(ellipse at 50% 0%,rgba(61,170,110,.15) 0%,rgba(61,170,110,.04) 100%);
  border:1px solid rgba(85,204,136,.3);
  animation:banner-rise .55s cubic-bezier(.34,1.46,.64,1) both;
}
.banner.lose{
  display:block;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,64,64,.15) 0%,rgba(201,64,64,.04) 100%);
  border:1px solid rgba(232,85,85,.3);
  animation:banner-rise .55s cubic-bezier(.34,1.46,.64,1) both;
}
@keyframes banner-rise{
  0%{transform:scale(.9) translateY(14px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.banner-title{font-family:'Cinzel',serif;font-size:1.5rem;letter-spacing:.12em;margin-bottom:.5rem}
.banner.win .banner-title{color:var(--green2)}
.banner.lose .banner-title{color:var(--red2)}
.banner-sub{font-style:italic;font-size:1rem;color:var(--text2)}

/* Ornament divider */
.ornament{
  display:flex;align-items:center;gap:1rem;color:var(--text3);font-size:.62rem;
  letter-spacing:.28em;width:100%;max-width:420px;
}
.ornament::before,.ornament::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(to right,transparent,var(--border2),transparent);
}

/* Keyboard */
.keyboard{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:630px;width:100%}
.key{
  font-family:'Cinzel',serif;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  width:44px;height:44px;background:var(--surface2);border:1px solid var(--border2);
  border-radius:9px;color:var(--text2);cursor:pointer;
  transition:background .12s,color .12s,border-color .12s,transform .1s,box-shadow .2s,opacity .25s;
  position:relative;overflow:hidden;
}
.key::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.06),transparent 65%);
  pointer-events:none;
}
.key:hover:not(:disabled){background:#1c1c32;border-color:#3838588;color:var(--text);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.key:active:not(:disabled){transform:scale(.91)}
.key:disabled{opacity:.2;cursor:not-allowed}
.key.kc{background:rgba(61,170,110,.1);border-color:rgba(85,204,136,.4);color:var(--green2);box-shadow:0 0 10px rgba(61,170,110,.2)}
.key.kw{background:rgba(201,64,64,.08);border-color:rgba(232,85,85,.3);color:var(--red)}

/* New game button */
.btn-new{
  font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.22em;
  padding:.85rem 2.8rem;background:transparent;
  border:1px solid var(--gold-dim);border-radius:999px;color:var(--gold);
  cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .15s;
  position:relative;overflow:hidden;
}
.btn-new::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(201,168,76,.03));opacity:0;transition:opacity .2s}
.btn-new:hover{border-color:var(--gold);box-shadow:0 0 30px rgba(201,168,76,.2),inset 0 0 24px rgba(201,168,76,.04);transform:translateY(-2px)}
.btn-new:hover::before{opacity:1}
.btn-new:active{transform:scale(.97)}

/* Animations */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  15%{transform:translateX(-10px)}
  30%{transform:translateX(10px)}
  45%{transform:translateX(-7px)}
  60%{transform:translateX(7px)}
  75%{transform:translateX(-3px)}
  90%{transform:translateX(3px)}
}
.shaking{animation:shake .46s cubic-bezier(.36,.07,.19,.97) both}

@keyframes win-glow{
  0%,100%{box-shadow:0 0 0 0 transparent}
  50%{box-shadow:0 0 40px 4px rgba(201,168,76,.22)}
}
.word-glow{animation:win-glow .7s ease .05s 3}

/* Particles */
#sparks{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.spark{
  position:absolute;border-radius:50%;pointer-events:none;
  animation:spark-fly var(--dur) ease-out var(--delay) forwards;
}
@keyframes spark-fly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}
</style>
</head>
<body>
<div class="bg-stars"></div>
<div class="bg-vignette"></div>
<div class="bg-fog"></div>
<div id="sparks"></div>

<div class="page">

  <div class="header">
    <h1 class="title">WISIELEC</h1>
    <p class="tagline">Gra słów &nbsp;·&nbsp; Na krawędzi znaczenia</p>
  </div>

  <div class="score-strip">
    <div class="score-item"><span class="score-label">Wygrane</span><span class="score-val" id="sw">0</span></div>
    <div class="score-item"><span class="score-label">Przegrane</span><span class="score-val" id="sl">0</span></div>
    <div class="score-item"><span class="score-label">Seria</span><span class="score-val" id="ss">0</span></div>
  </div>

  <div class="arena">
    <!-- Gallows -->
    <div class="gallows-card">
      <svg id="gsvg" viewBox="0 0 200 215" xmlns="http://www.w3.org/2000/svg">
        <line x1="18" y1="208" x2="182" y2="208" stroke="#252540" stroke-width="5" stroke-linecap="round"/>
        <line x1="52" y1="208" x2="52" y2="16" stroke="#252540" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="52" y1="16" x2="132" y2="16" stroke="#252540" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="52" y1="40" x2="74" y2="16" stroke="#252540" stroke-width="3" stroke-linecap="round"/>
        <g class="sway-group">
          <line id="pr" x1="132" y1="16" x2="132" y2="40" stroke="#8b7355" stroke-width="2" stroke-linecap="round" class="gpart" style="stroke-dasharray:28;stroke-dashoffset:28"/>
          <circle id="ph" cx="132" cy="57" r="17" stroke="#c9a84c" stroke-width="2.5" fill="rgba(11,11,22,.9)" class="gpart"/>
          <circle class="face-el" id="fe1" cx="126" cy="54" r="2" fill="#c9a84c"/>
          <circle class="face-el" id="fe2" cx="138" cy="54" r="2" fill="#c9a84c"/>
          <path class="face-el" id="fe3" d="M126 64 Q132 69 138 64" stroke="#c9a84c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <line id="pb" x1="132" y1="74" x2="132" y2="136" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" class="gpart"/>
          <line id="pal" x1="132" y1="92" x2="105" y2="116" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" class="gpart"/>
          <line id="par" x1="132" y1="92" x2="159" y2="116" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" class="gpart"/>
          <line id="pll" x1="132" y1="136" x2="108" y2="170" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" class="gpart"/>
          <line id="plr" x1="132" y1="136" x2="156" y2="170" stroke="#c9a84c" stroke-width="2.5" stroke-linecap="round" class="gpart"/>
        </g>
      </svg>
      <div class="lives-row" id="lives-row"></div>
    </div>

    <!-- Info panel -->
    <div class="info-panel">
      <div class="cat-row">
        <span class="cat-badge" id="cat-badge">—</span>
        <span class="proverb-flag" id="pf-label"></span>
      </div>
      <div class="info-box">
        <span class="box-lbl">Podpowiedź</span>
        <p class="hint-text" id="hint-el">—</p>
      </div>
      <div class="info-box">
        <span class="box-lbl">Błędne litery</span>
        <div class="wrong-area" id="wrong-area"></div>
      </div>
      <div class="info-box">
        <span class="box-lbl">Postęp</span>
        <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
        <div class="prog-text" id="prog-text">0 / 0 liter</div>
      </div>
    </div>
  </div>

  <!-- Word -->
  <div class="word-wrap" id="word-wrap">
    <div class="word-inner" id="word-inner"></div>
  </div>

  <!-- Banner -->
  <div class="banner" id="banner">
    <div class="banner-title" id="b-title"></div>
    <div class="banner-sub" id="b-sub"></div>
  </div>

  <div class="ornament">✦&nbsp;&nbsp;WYBIERZ LITERĘ&nbsp;&nbsp;✦</div>

  <div class="keyboard" id="keyboard"></div>

  <button class="btn-new" onclick="newGame()">✦&nbsp;&nbsp;NOWA GRA&nbsp;&nbsp;✦</button>

</div>

<script>
const WORDS=[
  // Zwierzęta

  {w:"MONSUN",      c:"Przyroda",   h:"Sezonowy wiatr przynoszący obfite deszcze do Azji"},

const PIDS=["pr","ph","pb","pal","par","pll","plr"];
const MAX=PIDS.length;
const PL="AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSŚTUWYZŹŻ".split("");
let word,cat,hint,isProv,guessed,wrongs,over,wins=0,losses=0,streak=0;

function pick(){return WORDS[Math.floor(Math.random()*WORDS.length)]}

function newGame(){
  const e=pick();
  word=e.w.toUpperCase();cat=e.c;hint=e.h;isProv=!!e.p;
  guessed=new Set();wrongs=0;over=false;
  document.getElementById("cat-badge").textContent=cat;
  document.getElementById("pf-label").textContent=isProv?"— przysłowie —":"";
  document.getElementById("hint-el").textContent=hint;
  document.getElementById("banner").className="banner";
  document.getElementById("wrong-area").innerHTML="";
  document.getElementById("word-wrap").classList.remove("word-glow");
  PIDS.forEach(id=>{const el=document.getElementById(id);el.className="gpart";el.classList.remove("show")});
  ["fe1","fe2","fe3"].forEach(id=>document.getElementById(id).classList.remove("show"));
  buildLives();buildWord();buildKeys();updateProg();
}

function buildLives(){
  const r=document.getElementById("lives-row");r.innerHTML="";
  for(let i=0;i<MAX;i++){const d=document.createElement("div");d.className="pip";d.id="p"+i;r.appendChild(d)}
}

function buildWord(){
  const inner=document.getElementById("word-inner");inner.innerHTML="";
  word.split("").forEach((ch,i)=>{
    const s=document.createElement("div");
    s.className="slot"+(ch===" "?" sp":"");s.id="s"+i;
    const c=document.createElement("div");c.className="slot-ch";c.id="c"+i;
    c.textContent=ch===" "?" ":"";
    const l=document.createElement("div");l.className="slot-line";
    s.appendChild(c);s.appendChild(l);inner.appendChild(s);
  });
}

function buildKeys(){
  const kb=document.getElementById("keyboard");kb.innerHTML="";
  PL.forEach(lt=>{
    const b=document.createElement("button");
    b.className="key";b.textContent=lt;b.id="k"+lt;
    b.addEventListener("click",()=>guess(lt));
    kb.appendChild(b);
  });
}

function updateProg(){
  const letters=word.replace(/ /g,"").split("");
  const rev=letters.filter(c=>guessed.has(c)).length;
  const total=letters.length;
  document.getElementById("prog-fill").style.width=(total?Math.round(rev/total*100):0)+"%";
  document.getElementById("prog-text").textContent=rev+" / "+total+" liter";
}

function guess(lt){
  if(over||guessed.has(lt))return;
  guessed.add(lt);
  const btn=document.getElementById("k"+lt);
  if(btn)btn.disabled=true;
  if(word.includes(lt)){
    if(btn)btn.classList.add("kc");
    revealLetter(lt);updateProg();checkWin();
  } else {
    if(btn)btn.classList.add("kw");
    wrongs++;
    const pip=document.getElementById("p"+(MAX-wrongs));
    if(pip)pip.classList.add("lost");
    showPart(wrongs-1);
    addChip(lt);updateProg();
    const ww=document.getElementById("word-wrap");
    ww.classList.remove("shaking");void ww.offsetWidth;ww.classList.add("shaking");
    checkLose();
  }
}

function showPart(idx){
  const el=document.getElementById(PIDS[idx]);
  if(!el)return;
  setTimeout(()=>{
    el.classList.add("show");
    if(PIDS[idx]==="ph"){
      setTimeout(()=>["fe1","fe2","fe3"].forEach(id=>document.getElementById(id).classList.add("show")),600);
    }
  },60);
}

function revealLetter(lt){
  word.split("").forEach((ch,i)=>{
    if(ch===lt){
      const c=document.getElementById("c"+i);
      const s=document.getElementById("s"+i);
      c.textContent=lt;c.classList.remove("reveal","reveal-wrong");
      void c.offsetWidth;c.classList.add("reveal");
      s.classList.add("lit");
    }
  });
}

function addChip(lt){
  const chip=document.createElement("span");
  chip.className="wchip";chip.textContent=lt;
  document.getElementById("wrong-area").appendChild(chip);
}

function checkWin(){
  if(!word.split("").every(c=>c===" "||guessed.has(c)))return;
  wins++;streak++;
  document.getElementById("sw").textContent=wins;
  document.getElementById("ss").textContent=streak;
  endGame(true);
}

function checkLose(){
  if(wrongs<MAX)return;
  losses++;streak=0;
  document.getElementById("sl").textContent=losses;
  document.getElementById("ss").textContent=0;
  word.split("").forEach((ch,i)=>{
    if(ch!==" "&&!guessed.has(ch)){
      const c=document.getElementById("c"+i);
      c.textContent=ch;c.classList.remove("reveal","reveal-wrong");
      void c.offsetWidth;c.classList.add("reveal-wrong");
    }
  });
  endGame(false);
}

function endGame(won){
  over=true;disableAll();
  const banner=document.getElementById("banner");
  document.getElementById("b-title").textContent=won?"Brawo! Odgadłeś!":"Niestety... Koniec gry";
  document.getElementById("b-sub").textContent=won
    ?(isProv?'Przysłowie: "'+word+'"':'Kategoria: '+cat+' · '+word)
    :'Słowo brzmiało: "'+word+'"';
  banner.className="banner "+(won?"win":"lose");
  if(won){
    document.getElementById("word-wrap").classList.add("word-glow");
    spawnSparks();
  }
}

function disableAll(){PL.forEach(l=>{const b=document.getElementById("k"+l);if(b)b.disabled=true})}

function spawnSparks(){
  const f=document.getElementById("sparks");
  const cols=["#c9a84c","#e8c96a","#f0d980","#ffffff","#55cc88","#aaffcc"];
  for(let i=0;i<70;i++){
    const p=document.createElement("div");p.className="spark";
    const x=20+Math.random()*60;const y=20+Math.random()*50;
    const dx=(Math.random()-.5)*340+"px";
    const dy=(-120-Math.random()*300)+"px";
    const sz=2+Math.random()*5;
    p.style.cssText=`left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;
      background:${cols[i%cols.length]};--dx:${dx};--dy:${dy};
      --dur:${.8+Math.random()*.8}s;--delay:${Math.random()*.5}s`;
    f.appendChild(p);
    setTimeout(()=>p.remove(),1800);
  }
}

// Physical keyboard
document.addEventListener("keydown",e=>{
  const lt=e.key.toUpperCase();
  if(PL.includes(lt)&&!over)guess(lt);
  if(e.key==="Enter")newGame();
});

document.getElementById("word-wrap").addEventListener("animationend",function(){
  this.classList.remove("shaking");
});

newGame();
</script>
